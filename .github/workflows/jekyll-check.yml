name: Validate Jekyll site

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: validation
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Validate generated content
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/publications/index.html
          test -f _site/publications/synlogic/index.html
          test -f _site/publications/perception-bottleneck-vlm-chart-understanding/index.html
          test -f _site/publications/universal-truthfulness-hyperplane-llms/index.html
          test -f _site/publications/in-context-sharpness-hallucination-mitigation/index.html
          test -f _site/publications/c-eval-chinese-evaluation-suite-foundation-models/index.html
          test -f _site/publications/composing-parameter-efficient-modules-arithmetic-operations/index.html

          check_home() { grep -Fq "$1" _site/index.html || { echo "MISSING IN HOME: $1"; exit 1; }; }
          check_pubs() { grep -Fq "$1" _site/publications/index.html || { echo "MISSING IN PUBLICATIONS: $1"; exit 1; }; }

          for text in \
            "Junteng Liu" "First-year Ph.D. candidate in the HKUST NLP Group" \
            "Shanghai Jiao Tong University" "June 2024" "Natural Language Processing" "Machine Learning" \
            "LLM Reasoning and Reinforcement Learning" "Hallucination in Vision-Language Models (VLM)" \
            "LLM Truthfulness and Interpretability" "Ph.D. in Computer Science (2024–Present)" \
            "B.Eng. (2020–2024)" "Professor Junxian He" "Zhiyuan Honor Scholarship" \
            "MINIMAX" "February 2025–Present" "Tencent WXG" "June 2024–September 2024" "Zifei Shan" \
            "Shanghai AI Lab" "June 2023–December 2023" "Prof. Yu Cheng" \
            "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond" \
            "On the Perception Bottleneck of VLMs for Chart Understanding" \
            "On the Universal Truthfulness Hyperplane Inside LLMs" \
            "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation" \
            "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models" \
            "Composing Parameter-Efficient Modules with Arithmetic Operations" \
            "Yuanxiang Fan" "Zhuo Jiang" "Han Ding" "Yongyi Hu" "Chi Zhang" "Yiqi Shi" "Shitong Weng" \
            "Aili Chen" "Shiqi Chen" "Yunan Huang" "Mozhi Zhang" "Pengyu Zhao" "Junjie Yan" "Junxian He" \
            "Weihao Zeng" "Xiwen Zhang" "Yijun Wang" "Zifei Shan" "Yu Cheng" "Miao Xiong" "Zhengxuan Wu" \
            "Teng Xiao" "Siyang Gao" "Yuzhen Huang" "Yuzhuo Bai" "Zhihao Zhu" "Junlei Zhang" \
            "Jinghan Zhang" "Tangjun Su" "Junteng Liu" "Chuancheng Lv" "Yikai Zhang" "Jiayi Lei" \
            "Yao Fu" "Maosong Sun" "Jinghan Zhang" "EMNLP 2024" "ICML 2024" "NeurIPS 2023" "Arxiv" \
            "Vision4Chart" "Universal_Truthfulness_Hyperplane" \
            "jliugi@connect.ust.hk" "https://github.com/Vicent0205" \
            "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate" \
            "@junteng88716710" "https://x.com/junteng88716710" \
            "Research Interests and Skills" "Academic Background" "Research Experience" \
            "Publications" "Contact Information"; do
            check_home "$text"
          done

          for text in \
            "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond" \
            "On the Perception Bottleneck of VLMs for Chart Understanding" \
            "On the Universal Truthfulness Hyperplane Inside LLMs" \
            "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation" \
            "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models" \
            "Composing Parameter-Efficient Modules with Arithmetic Operations" \
            "EMNLP 2024" "ICML 2024" "NeurIPS 2023" "Arxiv" "Junteng Liu"; do
            check_pubs "$text"
          done

          if grep -Eqi "Your Name|Paper Title Number|Skill 1|GitHub University|Academic Pages is|Journal 1" _site/index.html _site/publications/index.html; then
            echo "Template sample text remains in generated home or publications page."
            exit 1
          fi
      - name: Show generated publication files
        run: find _site/publications -type f | sort
