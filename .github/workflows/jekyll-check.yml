name: Validate Jekyll site

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: validation
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Validate generated content
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/publications/index.html
          for slug in synlogic perception-bottleneck-vlm-chart-understanding universal-truthfulness-hyperplane-llms in-context-sharpness-hallucination-mitigation c-eval-chinese-evaluation-suite-foundation-models composing-parameter-efficient-modules-arithmetic-operations; do
            test -f "_site/publications/$slug/index.html"
          done
          python3 - <<'PY'
          from pathlib import Path
          home = Path('_site/index.html').read_text(encoding='utf-8', errors='replace')
          pubs = Path('_site/publications/index.html').read_text(encoding='utf-8', errors='replace')
          home_terms = [
            'Junteng Liu', 'first-year Ph.D. candidate', 'HKUST NLP Group',
            'Hong Kong University of Science and Technology', 'Shanghai Jiao Tong University',
            'June 2024', 'Natural Language Processing', 'Machine Learning',
            'LLM Reasoning and Reinforcement Learning',
            'Hallucination in Vision-Language Models (VLM)',
            'LLM Truthfulness and Interpretability',
            'Ph.D. in Computer Science', '2024', 'Present', 'B.Eng.', '2020', '2024',
            'Professor Junxian He', 'Zhiyuan Honor Scholarship',
            'MINIMAX', 'February 2025', 'Tencent WXG', 'June 2024', 'September 2024',
            'Zifei Shan', 'Shanghai AI Lab', 'June 2023', 'December 2023', 'Prof. Yu Cheng',
            'SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond',
            'On the Perception Bottleneck of VLMs for Chart Understanding',
            'On the Universal Truthfulness Hyperplane Inside LLMs',
            'In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation',
            'C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models',
            'Composing Parameter-Efficient Modules with Arithmetic Operations',
            'Yuanxiang', 'Zhuo Jiang', 'Han Ding', 'Yongyi', 'Chi Zhang', 'Yiqi', 'Shitong',
            'Aili Chen', 'Shiqi Chen', 'Yunan', 'Mozhi', 'Pengyu', 'Junjie Yan', 'Junxian He',
            'Weihao Zeng', 'Xiwen Zhang', 'Yijun Wang', 'Zifei Shan', 'Yu Cheng', 'Miao Xiong',
            'Zhengxuan Wu', 'Teng Xiao', 'Siyang Gao', 'Yuzhen Huang', 'Yuzhuo Bai', 'Zhihao Zhu',
            'Junlei Zhang', 'Jinghan Zhang', 'Tangjun Su', 'Chuancheng Lv', 'Yikai Zhang',
            'Jiayi Lei', 'Yao Fu', 'Maosong Sun', 'EMNLP 2024', 'ICML 2024', 'NeurIPS 2023',
            'Arxiv', 'Vision4Chart', 'Universal_Truthfulness_Hyperplane',
            'jliugi@connect.ust.hk', 'https://github.com/Vicent0205',
            'https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate',
            '@junteng88716710', 'https://x.com/junteng88716710',
            'Research Interests and Skills', 'Academic Background', 'Research Experience',
            'Publications', 'Contact Information'
          ]
          pub_terms = [
            'Junteng Liu', 'Arxiv', 'EMNLP 2024', 'ICML 2024', 'NeurIPS 2023',
            'SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond',
            'On the Perception Bottleneck of VLMs for Chart Understanding',
            'On the Universal Truthfulness Hyperplane Inside LLMs',
            'In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation',
            'C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models',
            'Composing Parameter-Efficient Modules with Arithmetic Operations'
          ]
          missing_home = [t for t in home_terms if t.lower() not in home.lower()]
          missing_pubs = [t for t in pub_terms if t.lower() not in pubs.lower()]
          if missing_home:
              raise SystemExit('MISSING IN HOME: ' + ' | '.join(missing_home))
          if missing_pubs:
              raise SystemExit('MISSING IN PUBLICATIONS: ' + ' | '.join(missing_pubs))
          bad_terms = ['Your Name', 'Paper Title Number', 'Skill 1', 'GitHub University', 'Academic Pages is', 'Journal 1']
          bad = [t for t in bad_terms if t.lower() in home.lower() or t.lower() in pubs.lower()]
          if bad:
              raise SystemExit('TEMPLATE TEXT REMAINS: ' + ' | '.join(bad))
          print(f'Validation passed: home={len(home)} chars, publications={len(pubs)} chars')
          PY
      - name: Show generated publication files
        if: always()
        run: find _site/publications -type f | sort
